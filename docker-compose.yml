version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nonglink-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/secrets:/app/secrets
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nonglink-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nonglink-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    networks:
      - nonglink-net

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: nonglink-admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:80"
    depends_on:
      - backend
    networks:
      - nonglink-net

networks:
  nonglink-net:
    driver: bridge
